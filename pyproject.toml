[project]
name = "our-parks"
version = "0.1.0"
description = "A family app for browsing US National Park Service sites and logging visits"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "httpx2>=2.16.0",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.3.7",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1.8",
    "webauthn>=3.0.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "alembic>=1.20.1",
    "pillow>=13.0.0",
    "pytailwindcss>=0.4.2",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "uvicorn[standard]>=0.54.0",
]

[tool.vercel]
entrypoint = "app.main:app"
