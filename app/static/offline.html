<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Offline</title>
  <script>
    var m = document.cookie.match(/(?:^|; )theme=(dark|light|system)/);
    document.documentElement.dataset.theme = m ? m[1] : "dark";
  </script>
  <style>
    /* Dark by default; the app's theme cookie can switch to light or system. */
    :root { --bg: #020617; --fg: #f1f5f9; --muted: #94a3b8; --accent: #38bdf8; }
    :root[data-theme="light"] { --bg: #f8fafc; --fg: #0f172a; --muted: #64748b; --accent: #0284c7; }
    @media (prefers-color-scheme: light) {
      :root[data-theme="system"] { --bg: #f8fafc; --fg: #0f172a; --muted: #64748b; --accent: #0284c7; }
    }
    @supports (font: -apple-system-body) { html { font: -apple-system-body; } }
    body {
      margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 1rem;
      box-sizing: border-box; background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center;
    }
    h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
    p { color: var(--muted); margin: 0 0 1.5rem; max-width: 22rem; }
    button {
      min-height: 44px; padding: 0 1.25rem; border: 0; border-radius: .5rem;
      background: var(--accent); color: #fff; font: inherit; font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <h1>You're offline</h1>
    <p>Your data is never stored on this device. Reconnect to view it.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
