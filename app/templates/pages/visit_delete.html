{% extends "base.html" %}
{% block content %}
<div class="max-w-xl rounded-xl border border-slate-200 bg-white p-5 dark:border-slate-800 dark:bg-slate-900">
  <h2 class="text-lg font-semibold">Delete this visit?</h2>
  <p class="mt-2">{{ visit.park.name }}, {{ visit.visit_date.strftime("%b %-d, %Y") }}. This removes it from the family log for everyone, and can't be undone.</p>
  <form method="post" action="/visits/{{ visit.id }}/delete" class="mt-4 flex flex-wrap gap-3">
    <button type="submit" class="inline-flex min-h-[48px] items-center justify-center rounded-lg bg-red-600 px-6 font-semibold text-white hover:bg-red-700 dark:bg-red-500 dark:text-slate-950">Delete visit</button>
    <a href="/visits/{{ visit.id }}/edit" class="inline-flex min-h-[48px] items-center px-3 font-medium">Keep it</a>
  </form>
</div>
{% endblock %}
