{% extends "base.html" %}
{% block content %}
<div class="mx-auto max-w-sm pt-8 text-center">
  <img src="{{ url_for('static', path='icons/icon.svg') }}" alt="" class="mx-auto size-16 rounded-2xl">
  <h2 class="mt-4 text-xl font-semibold">Welcome to {{ app_name }}</h2>
  <p class="mt-2 text-slate-500 dark:text-slate-400">
    Create a passkey to finish setting up your account. You'll use Face ID, fingerprint or
    your device PIN to sign in, with no password to remember.
  </p>

  <button type="button" data-passkey="register"
          class="mt-6 inline-flex min-h-[48px] w-full items-center justify-center rounded-lg bg-sky-600 px-5 font-semibold text-white hover:bg-sky-700 disabled:opacity-60 dark:bg-sky-500 dark:hover:bg-sky-400 dark:text-slate-950">
    Create passkey
  </button>
  <p id="passkey-status" role="alert" class="mt-4 min-h-[1.5rem] text-sm text-red-600 dark:text-red-400"></p>

</div>
{% endblock %}
