{#- A 1-5 star rating, read aloud as "N of 5 stars". -#}
{% macro stars(rating, classes="") -%}
<span class="inline-flex items-center text-amber-500 dark:text-amber-400 {{ classes }}" role="img" aria-label="{{ rating }} of 5 stars">
  {%- for i in range(1, 6) -%}
  <svg class="size-4 {{ '' if i <= rating else 'opacity-25' }}" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m12 2.5 2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z"/></svg>
  {%- endfor -%}
</span>
{%- endmacro %}
