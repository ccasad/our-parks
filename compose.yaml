# Local development: `docker compose up` serves http://localhost:8000
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    env_file: .env   # copy from .env.example first
    volumes:
      - .:/app
      # Keep the container's Linux virtualenv and uv cache out of the bind mount,
      # so they never clash with anything on the Mac side.
      - venv:/opt/venv
      - uv-cache:/opt/uv-cache
      # Tailwind standalone binary downloaded by pytailwindcss
      - tailwind:/root/.local/share
    # Re-sync on start so dependency changes apply without a rebuild.
    command: >
      sh -c "uv sync --frozen &&
             exec uv run --frozen uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  venv:
  uv-cache:
  tailwind:
